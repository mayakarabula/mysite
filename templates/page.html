{% extends "base.html" %}

{% block content %}

{% if page.extra["image"] %}
  <img
    src='{{ page.extra["image"] }}'
    class="cover-image"
    alt="{{ page.title }}"
    {% if page.extra["image_height"] %}style="max-height: {{ page.extra["image_height"] }}"{% endif %}
  />
{% endif %}

<h1>{{ page.title }}</h1>

<a href="/"><< back home</a>

{{ page.content | safe }}

{% endblock content %}
